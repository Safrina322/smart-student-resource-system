name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Only the integration suite (npm run test:integration) touches this -
      # the default `npm test` unit suite mocks every repository and has no
      # DB dependency, so it stays fast even if this service were ever removed.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smartstudent_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      TEST_DB_NAME: smartstudent_test
      JWT_SECRET: ci-test-secret
      ADMIN_JWT_SECRET: ci-test-admin-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Gated on production dependencies + high/critical only: a devDependency
      # (e.g. a transitive eslint dependency) having a known issue shouldn't
      # block shipping since it never reaches a deployed environment, and a
      # moderate-severity finding on a dependency that needs a deliberate
      # major-version migration to fix shouldn't either - this still catches
      # any new high/critical issue in what actually ships.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run test:integration

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smartstudent-backend ./backend
      - run: docker build -t smartstudent-frontend ./frontend
