name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Gated on production dependencies + high/critical only: a devDependency
      # (e.g. a transitive eslint dependency) having a known issue shouldn't
      # block shipping since it never reaches a deployed environment, and a
      # moderate-severity finding on a dependency that needs a deliberate
      # major-version migration to fix shouldn't either - this still catches
      # any new high/critical issue in what actually ships.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
